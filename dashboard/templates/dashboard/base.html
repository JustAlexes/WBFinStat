{% load static %}
<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}FinStat{% endblock %}</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('finstat-theme') === 'dark' ? 'dark' : 'light';
      if (localStorage.getItem('finstat-sidebar') === 'collapsed' || (!localStorage.getItem('finstat-sidebar') && matchMedia('(max-width: 700px)').matches)) document.documentElement.classList.add('sidebar-collapsed');
    } catch (error) { /* Storage may be unavailable; use defaults. */ }
  </script>
  <link rel="stylesheet" href="{% static 'dashboard/app.css' %}?v=20261109-8">
  <script src="{% static 'dashboard/app.js' %}?v=20261109-8" defer></script>
  {% block page_scripts %}{% endblock %}
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="icon-report" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-products" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M7.5 5.5l9 5"/></symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 2-.5 2.3-2.1.9-2-1.2-2.4 2.4 1.2 2-1 2.1L1 11v2l2.2.5 1 2.1-1.2 2L5.4 20l2-1.2 2.1.9L10 22h4l.5-2.3 2.1-.9 2 1.2 2.4-2.4-1.2-2 1-2.1L23 13v-2l-2.2-.5-1-2.1 1.2-2L18.6 4l-2 1.2-2.1-.9L14 2z"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Боковое меню">
      <div class="sidebar-top">
        <a class="brand" href="{% url 'home' %}" aria-label="FinStat — Главная">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">Fin<span>Stat</span></span>
        </a>
        <button class="sidebar-toggle icon-button" type="button" id="sidebar-toggle" aria-label="Свернуть меню" aria-controls="sidebar" aria-expanded="true" title="Свернуть меню">
          <svg class="icon"><use href="#icon-panel"></use></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Основное меню">
        <span class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</span>
        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %} title="Главная">
          <svg class="icon"><use href="#icon-grid"></use></svg><span class="nav-label">Главная</span>
        </a>
        <a class="nav-link {% if request.resolver_match.url_name == 'financial_reports' %}active{% endif %}" href="{% url 'financial_reports' %}" {% if request.resolver_match.url_name == 'financial_reports' %}aria-current="page"{% endif %} title="Финансовые отчёты">
          <svg class="icon"><use href="#icon-report"></use></svg><span class="nav-label">Финансовые отчёты</span>
        </a>
        <a class="nav-link {% if request.resolver_match.url_name == 'assortment' %}active{% endif %}" href="{% url 'assortment' %}" {% if request.resolver_match.url_name == 'assortment' %}aria-current="page"{% endif %} title="Ассортимент">
          <svg class="icon"><use href="#icon-products"></use></svg><span class="nav-label">Ассортимент</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="profile-menu" id="profile-menu" hidden>
          <a href="{% url 'profile' %}" class="profile-menu-link"><svg class="icon"><use href="#icon-user"></use></svg>Профиль</a>
          <a href="{% url 'settings' %}" class="profile-menu-link"><svg class="icon"><use href="#icon-settings"></use></svg>Настройки</a>
        </div>
        <button class="profile-trigger" type="button" id="profile-trigger" aria-label="Меню пользователя Александр" aria-haspopup="true" aria-controls="profile-menu" aria-expanded="false" title="Александр">
          <span class="avatar" aria-hidden="true">А</span>
          <span class="profile-copy"><strong>Александр</strong><small>Профиль пользователя</small></span>
          <svg class="icon profile-chevron"><use href="#icon-chevron"></use></svg>
        </button>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb">FinStat <span>/</span> <strong>{% block breadcrumb %}Главная{% endblock %}</strong></div>
        <span class="topbar-badge">Wildberries</span>
      </header>
      <main class="page-content {% block page_class %}{% endblock %}" id="main-content">{% block content %}{% endblock %}</main>
    </div>
  </div>
</body>
</html>
